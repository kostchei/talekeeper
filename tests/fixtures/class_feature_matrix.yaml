metadata:
  version: "0.2"
  sr_doc: "docs/SRD_CC_v5.2.1.md"
  last_updated: "2025-11-19"
  description: >
    Narrowed scope matrix for SRD 2024 classes currently implemented end-to-end
    in TaleKeeper (Barbarian, Fighter, Rogue, Cleric, Wizard, Warlock, Paladin).

classes:
  barbarian:
    sr_section: "docs/SRD_CC_v5.2.1.md:48-50"
    default_subclass: "Path of the Berserker"
    template:
      path: "templates/barbarian_berserker.json"
      notes: "Uses Thrud berserker exemplar"
    services:
      - "scripts.character_tools.programmatic_character_creator.ProgrammaticCharacterCreator"
      - "talekeeper.services.unified_level_up.UnifiedLevelUpService"
      - "services.barbarian_abilities.BarbarianAbilitiesService"
    automation:
      backend_suite: "tests/test_fighter_progression_complete.py (generalized)"
      ui_suite: "tests/testing_framework_ui_automation.py"
    feature_groups:
      - id: rage
        name: "Rage"
        level: 1
        sr_ref: "docs/SRD_CC_v5.2.1.md:48"
        tk_service: "BarbarianAbilitiesService.update_barbarian_resources_for_level"
        db_tables: ["barbarian_features"]
        ui_targets: ["ActionPanel:RageToggle"]
        verification:
          backend:
            status: "planned"
            tests: []
          ui:
            status: "planned"
            tests: []
      - id: reckless_attack
        name: "Reckless Attack"
        level: 2
        sr_ref: "docs/SRD_CC_v5.2.1.md:49"
        tk_service: "BarbarianAbilitiesService.update_barbarian_resources_for_level"
        db_tables: ["barbarian_features"]
        ui_targets: ["ActionPanel:RecklessAttackToggle"]
        verification:
          backend:
            status: "planned"
            tests: []
          ui:
            status: "planned"
            tests: []
      - id: frenzy
